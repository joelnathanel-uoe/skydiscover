language: python
diff_based_generation: true
max_iterations: 500
checkpoint_interval: 10
max_solution_length: 60000

llm:
  models:
    - name: "gpt-4o-mini"
      weight: 1.0
  max_tokens: 16384
  timeout: 600

prompt:
  system_message: |
    You are an expert in combinatorial optimization and scheduling.
    Your task is to discover a high-performance construction heuristic
    for the Flexible Job Shop Scheduling Problem with Total Weighted
    Tardiness (FJSP-TWT).

    Problem: Given n jobs (each a sequence of operations) and m machines,
    assign each operation to one eligible machine and determine start times
    to minimise total weighted tardiness: sum_i w_i * max(0, C_i - d_i),
    where w_i is the weight, d_i the due date, and C_i the completion time
    of job i.

    Your heuristic must implement solve(instance) where instance is a dict:
      n_jobs (int): number of jobs
      n_machines (int): number of machines
      jobs (list of dicts): each with
        release_time (int), due_date (int), weight (float),
        operations (list of lists of [machine_id, proc_time] pairs)

    Return a list of dicts, one per scheduled operation:
      {'job': int, 'op': int, 'machine': int, 'start': int, 'end': int}

    Feasibility constraints that must be satisfied:
      1. Precedence: operations within a job must be scheduled in order —
         op k cannot start until op k-1 has finished.
      2. Release time: the first operation of job j cannot start before
         jobs[j]['release_time'].
      3. Machine capacity: each machine can process at most one operation
         at a time — no two operations on the same machine may overlap.
      4. Machine eligibility: each operation must be assigned to one of its
         listed eligible machines only.
      5. No preemption: once an operation starts it runs to completion.

    Baseline you must beat: MODD (Modified Operation Due Date).
    MODD works as follows:
      - Each operation is assigned a deadline by propagating the job due date
        backwards through the operation sequence:
          op_due = job_due - sum(min processing time of all later operations)
      - At each step, the operation with the earliest op_due is dispatched.
      - Machine selection uses earliest finish time (EFT).

    Score = modd_twt / (modd_twt + your_twt) averaged over benchmark
    instances — 0.5 ties MODD, 1.0 means zero tardiness, below 0.5 means
    worse than MODD. Maximise this. Invalid schedules score 0.

    Known scheduling heuristics to draw from and build on — this list is not
    exhaustive; you are encouraged to go beyond these and draw on any other
    ideas from scheduling theory, operations research, or elsewhere:

      - WSPT: priority = w / p
          Minimises weighted completion time. Ignores due dates entirely.
      - EDD: priority = -due_date
          Minimises maximum lateness. Ignores weights and processing times.
      - MS (Minimum Slack): priority = -(due_date - t - p)
          Urgency-aware but ignores weight.
      - CR (Critical Ratio): priority = (due_date - t) / p
          Ratio of time available to time needed.
      - COVERT: priority = (w / p) * max(0, 1 - max(due_date - t - p, 0) / (k * p_avg))
          Blends WSPT with urgency; non-urgent jobs fall back to WSPT.
      - ATC (Apparent Tardiness Cost) — widely considered the strongest
        single-machine rule for TWT:
          priority = (w / p) * exp(-max(due_date - p - t, 0) / (k * p_avg))
          where k is a tuning parameter (typically 2-4) and p_avg is the
          average processing time of remaining operations.
          Smoothly boosts priority exponentially as urgency increases.

    FJSP-specific considerations:
      - Machine selection and job sequencing interact. EFT is standard but
        not always best — a slightly slower machine may free a bottleneck
        for a more urgent job.
      - Remaining workload per machine (load balancing) can inform both
        priority and machine selection.
      - The op_due concept from MODD can be generalised — instead of min
        processing times, use expected times, machine load estimates, or
        weight-adjusted deadlines.
      - At each dispatch step you have full global information: all machine
        availabilities, all job states, all remaining operations. Use it.

    Your goal: design a construction heuristic that decisively beats MODD.
    To do so you likely need to combine urgency, weight, and processing time
    more richly than any single classical rule. Novel combinations, entirely
    new priority functions, or ideas from outside classical scheduling
    literature are all encouraged.

    Restrictions:
      - Construction heuristic only — greedy dispatching, no metaheuristics,
        search, or RL.
      - Python standard library + numpy only. No external solvers or packages
        requiring installation.
      - Must run fast (well under 1 second per instance).

evaluator:
  timeout: 120
  cascade_evaluation: false

search:
  type: adaevolve
  num_context_programs: 1
  database:
    num_islands: 3
    population_size: 20
    migration_interval: 30
    migration_count: 1
    fitness_key: combined_score
    higher_is_better:
      combined_score: true
    fitness_weight: 0.7
    novelty_weight: 0.3
    use_paradigm_breakthrough: true

monitor:
  enabled: true
  port: 8765
  host: "127.0.0.1"

human_feedback_enabled: true
