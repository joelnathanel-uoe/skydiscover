language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000

llm:
  models:
    - name: "gpt-5.5"
      weight: 1.0
  max_tokens: 16384
  timeout: 600

prompt:
  system_message: |
    You are an expert in combinatorial optimization and scheduling. Your task
    is to write a heuristic for the Flexible Job Shop Scheduling Problem with
    Total Weighted Tardiness (FJSP-TWT).

    --- The problem ---

    n jobs and m machines. Each job is a fixed sequence of operations; each
    operation must run on one of its eligible machines without preemption. A
    job's operations must run in order — operation k cannot start until
    operation k-1 ends. Minimise total weighted tardiness:
      TWT = sum_j  w_j * max(0, C_j - d_j)
    where w_j is the job weight, d_j its due date, C_j its completion time.

    --- What your function must do ---

    Implement schedule_next. Each call, it selects one unscheduled operation,
    assigns it to an eligible machine, and places it in that machine's queue:

        def schedule_next(unscheduled, machine_sequences, start_times, end_times,
                          job_completion, instance):
            ...
            return op, machine, position

    Each call you return three things:
      op       — (j, o): which operation to place. Must be in unscheduled.
                   (j, o) is ready to place if o == 0 or (j, o-1) is placed.
      machine  — which machine to assign it to (must be eligible for that op).
      position — where in machine_sequences[machine] to insert it:
                   == len(seq): append at end — always feasible.
                   <  len(seq): insert before that index, shifting later ops
                                back. Invalid if it creates a job-precedence
                                cycle — the program is rejected.

    The state you have access to:
      unscheduled       set[(j, o)] — ops not yet placed
      machine_sequences dict[m -> list[(j, o)]] — each machine's queue
      start_times       dict[(j, o) -> int] — exact if placed; lower bound if not
      end_times         dict[(j, o) -> int] — exact if placed; lower bound if not
      job_completion    dict[j -> int | None] — completion of j's last op, or None
      instance          n_jobs, n_machines, jobs[{release_time, due_date, weight,
                          operations: [[[machine_id, proc_time], ...], ...]}]

    --- Domain background: classical dispatching rules ---

    Construction heuristics for this problem typically score every ready
    operation on every eligible machine with a priority rule, then repeatedly
    dispatch whichever (operation, machine) pair scores best. These are the
    building blocks strong classical rules are made of — useful vocabulary,
    not a formula to copy unmodified:

      Slack and the internal due date. A job's own due date d_i only applies
      to its LAST operation. To judge urgency of an earlier operation v,
      rules apportion d_i backward across the job's remaining work:
          d_v   = d_i - FF * (sum of min processing times over operations
                  of this job AFTER v)
          slack = d_v - t     (t = the earliest time this candidate could
                                start, i.e. its EFT decision time)
      FF ("flow factor") is an instance-specific constant capturing how
      stretched-out jobs tend to become end-to-end relative to raw work
      content. Negative or small slack means this operation is urgent.

      ATC (Apparent Tardiness Cost) — the strongest classical single rule
      for this problem. Priority of candidate (operation v on machine m,
      processing time p_v):
          priority = (w_i / p_v) * exp( -max(slack, 0) / (kappa * p_bar) )
      where w_i is the job's weight, p_bar is the average remaining
      processing time across all CURRENTLY ready candidates, and kappa is a
      lookahead/urgency parameter. Small kappa makes the rule myopic (chase
      whichever job is in danger right now); large kappa makes it behave
      more like plain weighted-SPT (ignore due dates, prefer fast jobs).
      There is no single best kappa — it depends on how tight due dates are
      relative to workload, and that tightness can differ across instances
      AND across different points within the same instance's schedule.

      Machine load / congestion. Always dispatching whichever single
      operation currently scores best (by any of the rules above) can
      repeatedly route work onto an already-backed-up machine while an
      equally-eligible, idle machine sits unused. None of the classical
      rules below look at machine queue length or congestion directly —
      worth considering as an additional signal, not just per-operation
      urgency.

      Other classical rules built from the same ingredients: FIFO/WFIFO
      (ready time, weighted by 1/w_i), SPT/WSPT (processing time, weighted),
      MOD/WMOD and ODD/WODD (variants combining the internal due date d_v
      above with processing time or start time). Every one of these is a
      SINGLE FIXED formula applied identically to every operation in every
      instance — none of them adapt their own parameters based on how the
      partial schedule looks so far, and none look ahead beyond the one
      operation being placed right now. That is the design space this
      family of rules occupies; you are not restricted to it.

    --- Scoring ---

    We score your function by running it on 50 benchmark instances and
    taking the median of:

      score = (cs_twt - your_twt) / cs_twt

    where cs_twt is the Combined Scheduler (CS) baseline (Sobeyko & Mönch,
    2016): for each instance, CS runs FIFO, WFIFO, ODD, WODD, MOD, WMOD,
    SPT, WSPT, and ATC swept over 70 values of kappa (0.1 to 7.0) — all
    using earliest-finish-time machine selection — and takes whichever of
    these ~78 schedules has the lowest total weighted tardiness on THAT
    instance. This is a strong, per-instance-optimized baseline: beating it
    means beating not just one fixed rule, but the best of an entire
    portfolio of them, re-picked per instance.

    A positive score means your schedule achieved lower tardiness than the
    baseline. A score of 0 means you tied it; negative means you did worse. If
    your function produces an invalid schedule or times out on any instance, the
    program is invalid. Your aim is to beat the baseline as much as you can.

    --- Constraints ---

    schedule_next is called once per operation.

    No state between calls: each call receives a fresh copy of instance — anything
    written to it is lost. Setting attributes on the function itself (e.g.
    schedule_next._cache = ...) is also forbidden and will invalidate the program.
    Design your heuristic to make each dispatch decision using only the arguments
    passed in that call.

    Each call has a time budget proportional to the number of feasible
    (ready op, machine) pairs at that step.

    Restrictions: Python standard library + numpy only.

evaluator:
  timeout: 600
  cascade_evaluation: false

search:
  type: adaevolve
  num_context_programs: 1
  database:
    num_islands: 3
    population_size: 20
    migration_interval: 30
    migration_count: 1
    fitness_key: combined_score
    higher_is_better:
      combined_score: true
    fitness_weight: 0.7
    novelty_weight: 0.3
    use_paradigm_breakthrough: true
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30

monitor:
  enabled: true
  port: 8772
  host: "127.0.0.1"

human_feedback_enabled: true
