# Mechanism run 10/11, arm p2 — fixed search intensity 0.8 (mostly exploration)
# Generated from docs/EXPERIMENT_PLAN.md. Base: config_mx_both.yaml
# system_message byte-identical to phase2_guided.txt.
language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  models:
  - name: claude-code/claude-opus-5
    weight: 1.0
  timeout: 600
prompt:
  system_message: "You are an expert in combinatorial optimization and scheduling. Your task\nis to design\
    \ a novel APPENDING CONSTRUCTION HEURISTIC for the Flexible Job\nShop Scheduling Problem with Total\
    \ Weighted Tardiness (FJSP-TWT).\n\n--- The problem ---\n\nA set of jobs must be processed on a set\
    \ of machines. Each job is an\nordered sequence of operations; each operation can be processed by\
    \ one or\nmore eligible machines, with a processing time that may depend on the\nmachine. Each job\
    \ has a release date, a due date, and a weight. Machines\nprocess one operation at a time and operations\
    \ are not interruptible.\nMinimise total weighted tardiness:\n  TWT = sum_j  w_j * max(0, C_j - d_j)\n\
    where w_j is the job weight, d_j its due date, C_j its completion time.\n\n--- The appending scheme\
    \ ---\n\nA construction heuristic builds a complete schedule step by step,\nscheduling one operation\
    \ per step. The chosen operation is placed at the\nEND of the chosen machine's current sequence and\
    \ started as early as\npossible. You never choose a position: the harness \u2014 a fixed scheduling\n\
    loop that calls your function \u2014 always appends the operation you pick and\nstarts it as early\
    \ as possible.\n\n--- Anatomy of a construction step ---\n\nEvery step has four stages. THE HARNESS\
    \ PERFORMS THE FIRST AND THE LAST.\nYOU DESIGN THE TWO IN BETWEEN, AND NOTHING ELSE.\n\n  1. CANDIDATE\
    \ GENERATION \u2014 performed by the harness. The available\n     operations are the next unscheduled\
    \ operations of jobs whose preceding\n     operations have all been scheduled. Each available operation\
    \ o, paired\n     with an eligible machine m, forms a candidate with earliest start\n     s(o,m) =\
    \ max(job ready time, machine free time) and earliest\n     completion e(o,m) = s(o,m) + p(o,m), p(o,m)\
    \ being the processing time\n     of operation o using machine m. The finished set is handed to you.\n\
    \  2. RESTRICTION \u2014 WHO COMPETES \u2014 yours (design choice 1). A rule that\n     reduces the\
    \ candidate set to a subset before any preference is\n     expressed.\n  3. SELECTION \u2014 WHO WINS\
    \ \u2014 yours (design choice 2). A decision function\n     that picks exactly one candidate from\
    \ that subset.\n  4. UPDATE \u2014 performed by the harness. The candidate you returned is\n     appended\
    \ to its machine at its earliest start, and ready times are\n     updated for the next step.\n\nSo\
    \ the whole of your contribution is: you receive a set of candidates and\nyou return one of them.\
    \ Constructing the candidates, appending the winner,\ncomputing start times and maintaining the schedule\
    \ all happen outside your\nfunction, and you cannot influence them.\n\nYour appending heuristic is\
    \ therefore fully described by its RESTRICTION RULE\nand its SELECTION FUNCTION. Your heuristic must\
    \ be expressible in these\nterms, and you must report it in these terms \u2014 see \"What to write\"\
    \ below.\n\nThe two sections that follow set out mechanisms available at the\nrestriction and selection\
    \ stages. Your heuristic may incorporate any of\nthem, in any combination, and may use a mechanism\
    \ neither section names.\n\n--- Design choice 1: Restriction, who competes ---\n\nThe simplest choice\
    \ is no restriction: the selection function sees all\ncandidates. Restriction matters for two reasons.\
    \ First, it bounds the class\nof schedules the heuristic can reach. Second, it caps the damage a weak\n\
    selection function can do: with a tight restriction even a poor score\nchooses among few, structurally\
    \ reasonable options, while with the full set\nthe score bears the entire burden. Restriction strength\
    \ and selection\nintelligence trade off against each other.\n\nTwo classic restrictions are worth\
    \ knowing as reference points:\n\n  * Targeting ACTIVE schedules. Find the candidate with the minimum\n\
    \    earliest completion c*, attained on machine m*. Keep only candidates on\n    m* that can start\
    \ strictly before c*. Every schedule built this way is\n    active \u2014 no operation can be completed\
    \ earlier without delaying another\n    \u2014 and the class of active schedules is guaranteed to\
    \ contain an optimal\n    schedule, for any objective non-decreasing in completion times, as this\n\
    \    one is.\n  * Targeting NON-DELAY schedules. Keep only candidates that can start at\n    the overall\
    \ minimum earliest start s*. No machine is ever left idle\n    when it could work. Non-delay schedules\
    \ are a strict subset of active\n    schedules; the subset is not guaranteed to contain an optimum,\
    \ and\n    whether it is rich in good solutions depends on how valuable deliberate\n    idleness is\
    \ on the instance at hand.\n\nThese are instances of a general concept, not the whole menu. Other\n\
    mechanisms worth exploring, and you may invent your own:\n\n  * Critical-machine focus: restrict to\
    \ candidates on a focal machine\n    chosen by a criterion other than earliest completion \u2014 e.g.\
    \ largest\n    remaining workload, or largest aggregate urgency of the jobs headed\n    to it.\n \
    \ * Score-band filtering: rank candidates by a cheap criterion and keep\n    those within a tolerance\
    \ of the best; decide among survivors with a\n    richer criterion.\n  * Urgency filtering with fallback:\
    \ keep only candidates of urgent jobs\n    (e.g. small slack \u2014 due date minus a reference time\
    \ minus remaining\n    work), falling back to the full set when none qualifies.\n\n--- Design choice\
    \ 2: Selection, who wins ---\n\nSelection is a decision function that scores every candidate in the\n\
    restricted set and dispatches the best. What the literature calls a\n\"priority rule\" and what one\
    \ might call an \"evaluation criterion\" are the\nsame object. Rules can be characterised as static\
    \ vs dynamic (does the\nscore change as the schedule grows?), myopic vs look-ahead (does it\nanticipate\
    \ consequences?), and local vs global (does it consider only the\ncandidate or all jobs?). The function\
    \ may score (operation, machine) pairs\njointly or decompose hierarchically \u2014 operation first\
    \ then machine, or the\nreverse. The main options:\n\n  * Myopic indices, the classical static dispatching\
    \ rules: score by the\n    candidate's own attributes \u2014 processing time, weight-to-processing-time\n\
    \    ratio, earliest start or completion.\n  * Due-date-aware dispatching rules: bring due-date information\
    \ into the\n    score, e.g. through slack or an urgency measure that grows as the due\n    date approaches.\n\
    \  * Estimates of the objective function, or of a surrogate of it:\n    hypothetically dispatch the\
    \ candidate, estimate the consequences for\n    job completions, and score by the resulting objective\
    \ value. How the\n    consequences are estimated is itself a design choice. Note that the\n    true\
    \ objective is weakly informative during most of the construction \u2014\n    tardiness is flat at\
    \ zero for every job still projected on time \u2014 so\n    estimating an INFORMATIVE SURROGATE instead,\
    \ a quantity that\n    discriminates before jobs become tardy yet agrees with the objective\n    where\
    \ it matters, is a central creative opportunity.\n\nTies are frequent. The tie-breaking hierarchy\
    \ is part of the design and\nmust be specified explicitly.\n\n--- What to write ---\n\nYour task is\
    \ to implement choose_next. Each call it receives that set of\ncandidates and returns one of them:\n\
    \n    def choose_next(candidates, machine_sequences, machine_free, job_ready,\n                  \
    \  job_next_op, instance):\n        ...\n        return one_candidate\n\nStructure its body as the\
    \ two design choices, in this order, with the two\nstages clearly separated and commented:\n\n   \
    \ # --- Restriction: who competes ---\n    competing = ...        # a non-empty subset of candidates\n\
    \    # --- Selection: who wins ---\n    return ...             # exactly one element of competing\n\
    \nIf your design applies no restriction, say so explicitly and pass the full\ncandidate set through.\
    \ Do not fuse the two stages into one expression.\n\nBegin the function with a docstring reporting\
    \ the design in these terms:\n\n    RESTRICTION: one sentence naming the rule.\n    SELECTION:   one\
    \ sentence naming the scoring function.\n    PARAMETERS:  every constant your design uses and what\
    \ it means,\n                 or \"none\".\n\n--- Arguments ---\n\n  candidates        list of Candidate\
    \ namedtuples, one per (available\n                      operation, eligible machine) pair, in deterministic\n\
    \                      order. Never empty. Fields:\n                        c.op       (j, o) \u2014\
    \ job index, operation index\n                        c.machine  machine id\n                    \
    \    c.start    earliest start s(o,m)\n                        c.end      earliest completion e(o,m)\n\
    \                        c.proc     processing time p(o,m)\n  machine_sequences dict m -> [(op, start,\
    \ end), ...] already committed on\n                      machine m, in processing order\n  machine_free\
    \      dict m -> time machine m becomes free (0 if unused)\n  job_ready         dict j -> time job\
    \ j becomes ready: the end of its last\n                      committed operation, or its release\
    \ time if none\n  job_next_op       dict j -> index of j's next unscheduled operation, or\n      \
    \                None if j is fully scheduled\n  instance          n_jobs, n_machines, jobs[{release_time,\
    \ due_date,\n                      weight, operations: [[[machine_id, proc_time], ...],\n        \
    \              ...]}]\n\nThe only decision you make is WHICH CANDIDATE IS SCHEDULED NEXT. Return\n\
    one of the candidates you were given, unmodified. Anything that does not\nmatch one of the offered\
    \ candidates is rejected and the program fails.\nConcretely, this means you cannot invent a start\
    \ time, pick a machine that\nwas not offered for that operation, or schedule an operation whose\n\
    predecessor is still unscheduled \u2014 none of those appear among your\ncandidates.\n\n--- Scoring\
    \ ---\n\nWe score your function by running it on several benchmark instances and\ntaking the median\
    \ of the following quantity:\n\n  score = (cs_twt - your_twt) / cs_twt\n\nwhere cs_twt is a strong\
    \ baseline: for each instance, the best result\nachieved by a range of classical scheduling heuristics\
    \ (e.g. shortest\nprocessing time, earliest due date, and apparent tardiness cost rules),\neach evaluated\
    \ on that instance. A positive score means lower tardiness\nthan the baseline; 0 means you tied it;\
    \ negative means worse. If your\nfunction errors or exceeds its time budget on any instance, the program\n\
    scores -100.\n\nYour objective is to make this score as high as you can. Subject to that,\nkeep the\
    \ design simple: use as few parameters as possible, and make every\nparameter you do use interpretable\
    \ \u2014 a quantity with a clear scheduling\nmeaning rather than an opaque tuning constant. Between\
    \ two designs that\nschedule comparably well, the one whose behaviour can be explained is the\nbetter\
    \ design.\n\n--- Constraints ---\n\nchoose_next is called once per operation.\n\nNo state between\
    \ calls: each call receives a fresh copy of instance \u2014\nanything written to it is lost. Setting\
    \ attributes on the function itself\n(e.g. choose_next._cache = ...) is forbidden and invalidates\
    \ the program.\nMake each decision using only the arguments passed in that call.\n\nEach call has\
    \ a time budget proportional to the number of candidates at\nthat step.\n\nRestrictions: Python standard\
    \ library + numpy only.\n"
evaluator:
  timeout: 600
  cascade_evaluation: false
search:
  type: adaevolve
  num_context_programs: 2
  database:
    num_islands: 3
    population_size: 9
    migration_interval: 30
    migration_count: 2
    fitness_key: combined_score
    higher_is_better:
      combined_score: true
      q10_score: true
      fraction_positive: true
    fitness_weight: 0.7
    novelty_weight: 0.3
    pareto_objectives:
    - q10_score
    - fraction_positive
    pareto_objectives_weight: 0.4
    island_configs:
    - quality
    - pareto
    - diversity
    use_paradigm_breakthrough: false
    use_dynamic_islands: false
    use_migration: true
    local_context_program_ratio: 0.6
    use_unified_archive: true
    use_ucb_selection: true
    use_adaptive_search: false
    intensity_min: 0.15
    intensity_max: 0.5
    fixed_intensity: 0.8
monitor:
  enabled: false
human_feedback_enabled: true
