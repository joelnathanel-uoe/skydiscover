# Mechanism run 10/11, arm p1 — fixed search intensity 0.8 (mostly exploration)
# Generated from docs/EXPERIMENT_PLAN.md. Base: config_mx_both.yaml
# system_message byte-identical to phase1_unguided.txt.
language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  models:
  - name: claude-code/claude-opus-5
    weight: 1.0
  timeout: 600
prompt:
  system_message: "You are an expert in combinatorial optimization and scheduling. Your task\nis to design\
    \ a novel APPENDING CONSTRUCTION HEURISTIC for the Flexible Job\nShop Scheduling Problem with Total\
    \ Weighted Tardiness (FJSP-TWT).\n\n--- The problem ---\n\nA set of jobs must be processed on a set\
    \ of machines. Each job is an\nordered sequence of operations; each operation can be processed by\
    \ one or\nmore eligible machines, with a processing time that may depend on the\nmachine. Each job\
    \ has a release date, a due date, and a weight. Machines\nprocess one operation at a time and operations\
    \ are not interruptible.\nMinimise total weighted tardiness:\n  TWT = sum_j  w_j * max(0, C_j - d_j)\n\
    where w_j is the job weight, d_j its due date, C_j its completion time.\n\n--- The appending scheme\
    \ ---\n\nA construction heuristic builds a complete schedule step by step,\nscheduling one operation\
    \ per step. The chosen operation is placed at the\nEND of the chosen machine's current sequence and\
    \ started as early as\npossible. You never choose a position: the harness \u2014 a fixed scheduling\n\
    loop that calls your function \u2014 always appends the operation you pick and\nstarts it as early\
    \ as possible.\n\n--- What your function must do ---\n\nThe available operations are the next unscheduled\
    \ operations of jobs whose\npreceding operations have all been scheduled. Each available operation\
    \ o,\npaired with an eligible machine m, forms a candidate with earliest start\ns(o,m) = max(job ready\
    \ time, machine free time) and earliest completion\ne(o,m) = s(o,m) + p(o,m), p(o,m) being the processing\
    \ time of operation o\nusing machine m.\n\nYour task is to implement choose_next. Each call it receives\
    \ that set of\ncandidates and returns one of them:\n\n    def choose_next(candidates, machine_sequences,\
    \ machine_free, job_ready,\n                    job_next_op, instance):\n        ...\n        return\
    \ one_candidate\n\n--- Arguments ---\n\n  candidates        list of Candidate namedtuples, one per\
    \ (available\n                      operation, eligible machine) pair, in deterministic\n        \
    \              order. Never empty. Fields:\n                        c.op       (j, o) \u2014 job index,\
    \ operation index\n                        c.machine  machine id\n                        c.start\
    \    earliest start s(o,m)\n                        c.end      earliest completion e(o,m)\n      \
    \                  c.proc     processing time p(o,m)\n  machine_sequences dict m -> [(op, start, end),\
    \ ...] already committed on\n                      machine m, in processing order\n  machine_free\
    \      dict m -> time machine m becomes free (0 if unused)\n  job_ready         dict j -> time job\
    \ j becomes ready: the end of its last\n                      committed operation, or its release\
    \ time if none\n  job_next_op       dict j -> index of j's next unscheduled operation, or\n      \
    \                None if j is fully scheduled\n  instance          n_jobs, n_machines, jobs[{release_time,\
    \ due_date,\n                      weight, operations: [[[machine_id, proc_time], ...],\n        \
    \              ...]}]\n\nThe only decision you make is WHICH CANDIDATE IS SCHEDULED NEXT. Return\n\
    one of the candidates you were given, unmodified. Anything that does not\nmatch one of the offered\
    \ candidates is rejected and the program fails.\nConcretely, this means you cannot invent a start\
    \ time, pick a machine that\nwas not offered for that operation, or schedule an operation whose\n\
    predecessor is still unscheduled \u2014 none of those appear among your\ncandidates.\n\n--- Scoring\
    \ ---\n\nWe score your function by running it on several benchmark instances and\ntaking the median\
    \ of the following quantity:\n\n  score = (cs_twt - your_twt) / cs_twt\n\nwhere cs_twt is a strong\
    \ baseline: for each instance, the best result\nachieved by a range of classical scheduling heuristics\
    \ (e.g. shortest\nprocessing time, earliest due date, and apparent tardiness cost rules),\neach evaluated\
    \ on that instance. A positive score means lower tardiness\nthan the baseline; 0 means you tied it;\
    \ negative means worse. If your\nfunction errors or exceeds its time budget on any instance, the program\n\
    scores -100.\n\nYour objective is to make this score as high as you can.\n\n--- Constraints ---\n\n\
    choose_next is called once per operation.\n\nNo state between calls: each call receives a fresh copy\
    \ of instance \u2014\nanything written to it is lost. Setting attributes on the function itself\n\
    (e.g. choose_next._cache = ...) is forbidden and invalidates the program.\nMake each decision using\
    \ only the arguments passed in that call.\n\nEach call has a time budget proportional to the number\
    \ of candidates at\nthat step.\n\nRestrictions: Python standard library + numpy only.\n"
evaluator:
  timeout: 600
  cascade_evaluation: false
search:
  type: adaevolve
  num_context_programs: 2
  database:
    num_islands: 3
    population_size: 9
    migration_interval: 30
    migration_count: 2
    fitness_key: combined_score
    higher_is_better:
      combined_score: true
      q10_score: true
      fraction_positive: true
    fitness_weight: 0.7
    novelty_weight: 0.3
    pareto_objectives:
    - q10_score
    - fraction_positive
    pareto_objectives_weight: 0.4
    island_configs:
    - quality
    - pareto
    - diversity
    use_paradigm_breakthrough: false
    use_dynamic_islands: false
    use_migration: true
    local_context_program_ratio: 0.6
    use_unified_archive: true
    use_ucb_selection: true
    use_adaptive_search: false
    intensity_min: 0.15
    intensity_max: 0.5
    fixed_intensity: 0.8
monitor:
  enabled: false
human_feedback_enabled: true
